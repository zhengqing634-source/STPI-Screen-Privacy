name: Build STPI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'STPI_android.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        run: |
          mkdir -p android
          unzip -q STPI_android.zip -d android
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          find android -maxdepth 3 -type f

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STPI-Screen-Privacy-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
